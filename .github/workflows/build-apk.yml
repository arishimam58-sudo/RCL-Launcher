name: Build and Release RCL Launcher APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Versi release, contoh 0.1.1"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract launcher source
        shell: bash
        run: |
          set -e

          unzip -q RLCJavaLauncher_APK_BUILD_READY.zip

          test -f RLCJavaLauncher/settings.gradle.kts
          test -f RLCJavaLauncher/build.gradle.kts
          test -f RLCJavaLauncher/app/build.gradle.kts
          test -f RLCJavaLauncher/app/src/main/AndroidManifest.xml

          echo "Source launcher ditemukan."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: RLCJavaLauncher
        shell: bash
        run: |
          set -e

          gradle --no-daemon --stacktrace :app:assembleDebug

          test -f app/build/outputs/apk/debug/app-debug.apk

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/RCL-Launcher.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCL-Launcher-debug
          path: RCL-Launcher.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.1.${{ github.run_number }}"
          fi

          TAG="v${VERSION}"

          gh release create "$TAG" \
            RCL-Launcher.apk \
            --repo "${{ github.repository }}" \
            --title "RCL Launcher ${TAG}" \
            --generate-notes
